# Local:      docker compose up --build                    -> http://localhost:8000
# Production: docker compose --profile prod up -d --build  -> https://bodemurairi.me
services:
  harvestwatch:
    build: .
    image: harvestwatch:local
    ports:
      - "127.0.0.1:8000:8000"   # this machine only; the public goes through Caddy
    env_file:
      - path: .env
        required: false   # without keys the app runs; only the AI pages are disabled
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # HTTPS in front of the app. Only runs with --profile prod.
  caddy:
    image: caddy:2-alpine
    profiles: ["prod"]
    depends_on:
      harvestwatch:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-bodemurairi.me}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # keeps the certificate across restarts
      - caddy_config:/config
    mem_limit: 128m
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
